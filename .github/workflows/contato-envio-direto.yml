name: Contato direto — revisão
on:
  pull_request:
    paths:
      - 'index.html'
      - 'supabase/**'
      - 'tests/contato-envio-direto.test.js'
      - '.github/workflows/contato-envio-direto.yml'
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/contato-envio-direto.test.js
