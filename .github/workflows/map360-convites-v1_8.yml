name: MAP360 convites simulados v1.8
on:
  pull_request:
    paths:
      - 'map360-convites-homologacao.html'
      - 'tests/map360-convites-v1_8.test.js'
      - '.github/workflows/map360-convites-v1_8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/map360-convites-v1_8.test.js
