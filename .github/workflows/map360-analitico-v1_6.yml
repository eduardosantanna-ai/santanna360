name: MAP 360 - relatorio analitico v1.6
on:
  pull_request:
    paths:
      - 'map360-demo.html'
      - 'js/map360-relatorio-analitico-v1_6.js'
      - 'js/map360-motor-v1_3.js'
      - 'tests/map360-relatorio-analitico-v1_6.test.js'
      - '.github/workflows/map360-analitico-v1_6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/map360-relatorio-analitico-v1_6.test.js
