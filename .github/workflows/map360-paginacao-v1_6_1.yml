name: MAP 360 - diagramação v1.6.1
on:
  pull_request:
    paths:
      - 'map360-demo.html'
      - 'js/map360-relatorio-analitico-v1_6.js'
      - 'tests/map360-paginacao-v1_6_1.js'
      - '.github/workflows/map360-paginacao-v1_6_1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Gerar relatorio ficticio
        run: node tests/map360-paginacao-v1_6_1.js
      - name: Verificar numero de paginas e texto
        run: |
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          pdfinfo visual-review/map360-1-6-1.pdf | grep Pages
          test "$(pdfinfo visual-review/map360-1-6-1.pdf | awk '/Pages:/ {print $2}')" -le 10
          pdftotext visual-review/map360-1-6-1.pdf - | grep -F '4.4 Leitura da dimensão Conexão'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map360-v1-6-1-pdf
          path: visual-review/
