</style><style>body{visibility:hidden}</style></head><body><header><div><strong>SANT'ANNA 360°</strong><small>Gestão inteligente • Pessoas, processos e resultados</small></div><nav><button onclick="view('inicio')">Início</button><button onclick="view('empresas')">Empresas</button><button onclick="view('dashboard')">Painel de gestão</button></nav></header><div class="shell"><div class="hero" id="hero"><span style="color:#e7cc96">CONSULTORIA ESPECIALIZADA</span><h1>RH, Departamento Pessoal e Controladoria.</h1><p>Organizamos processos, acompanhamos indicadores e transformamos diagnósticos em planos de ação mensuráveis.</p><button class="gold" onclick="view('empresas')">Acessar área de gestão</button></div><div class="layout"><aside class="side no-print" id="menu"></aside><main class="panel" id="main"></main></div></div><script>

al", "text": "A folha de pagamento é conferida?"}, {"id": "03-05", "area": "Departamento Pessoal", "text": "Os benefícios possuem controles?"}, {"id": "03-06", "area": "Departamento Pessoal", "text": "Os desligamentos seguem procedimento padronizado?"}, {"id": "03-07", "area": "Departamento Pessoal", "text": "As obrigações trabalhistas são monitoradas?"}, {"id": "03-08", "area": "Departamento Pessoal", "text": "Os documentos de pessoal estão organizados?"}, {"id": "04-01", "area": "Processos e Operações", "text": "Os processos principais estão mapeados?"}, {"id": "04-02", "area": "Processos e Operações", "text": "Existem procedimentos operacionais padronizados?"}, {"id": "04-03", "area": "Processos e Operações", "text": "As responsabilidades estão definidas?"}, {"id": "04-04", "area": "Processos e Operações", "text": "Os indicadores operacionais são acompanhados?"}, {"id": "04-05", "area": "Processos e Operações", "text": "Existem controles de qualidade?"}, {"id": "04-06", "area": "Processos e Operações", "text": "As não conformidades geram ações corretivas?"}, {"id": "04-07", "area": "Processos e Operações", "text": "Há controle de fornecedores e compras?"}, {"id": "04-08", "area": "Processos e Operações", "text": "Os processos são revisados periodicamente?"}, {"id": "05-01", "area": "Gestão Estratégica", "text": "A empresa possui objetivos estratégicos definidos?"}, {"id": "05-02", "area": "Gestão Estratégica", "text": "As metas são mensuráveis?"}, {"id": "05-03", "area": "Gestão Estratégica", "text": "Existem responsáveis por cada meta?"}, {"id": "05-04", "area": "Gestão Estratégica", "text": "A direção acompanha os resultados?"}, {"id": "05-05", "area": "Gestão Estratégica", "text": "Os riscos do negócio são avaliados?"}, {"id": "05-06", "area": "Gestão Estratégica", "text": "Existe planejamento de ações prioritárias?"}, {"id": "05-07", "area": "Gestão Estratégica", "text": "São realizadas reuniões de acompanhamento?"}, {"id": "05-08", "area": "Gestão Estratégica", "text": "As decisões são baseadas em indicadores?"}, {"id": "06-01", "area": "Comercial e Vendas", "text": "Existem metas comerciais?"}, {"id": "06-02", "area": "Comercial e Vendas", "text": "A empresa acompanha o funil de vendas?"}, {"id": "06-03", "area": "Comercial e Vendas", "text": "Há controle da carteira de clientes?"}, {"id": "06-04", "area": "Comercial e Vendas", "text": "Os resultados comerciais são medidos?"}, {"id": "06-05", "area": "Comercial e Vendas", "text": "Existe política de preços definida?"}, {"id": "06-06", "area": "Comercial e Vendas", "text": "O pós-venda é estruturado?"}, {"id": "06-07", "area": "Comercial e Vendas", "text": "A produtividade comercial é acompanhada?"}, {"id": "06-08", "area": "Comercial e Vendas", "text": "Há planejamento de prospecção?"}], MAPQ=[["A", "Sinto-me à vontade para tomar a iniciativa quando percebo algo que precisa ser feito."], ["A", "Prefiro transformar uma ideia em uma ação concreta sem esperar que todos os detalhes estejam definidos."], ["A", "Quando encontro obstáculos, costumo buscar alternativas para continuar avançando."], ["A", "Gosto de assumir a responsabilidade por decisões relacionadas ao meu trabalho."], ["A", "Sinto satisfação ao concluir tarefas e alcançar resultados objetivos."], ["A", "Em situações urgentes, consigo definir prioridades e agir."], ["C", "Gosto de compartilhar ideias com outras pessoas antes de desenvolver uma solução."], ["C", "Sinto-me à vontade para apresentar minhas opiniões em reuniões."], ["C", "Costumo iniciar conversas para conhecer melhor colegas de trabalho."], ["C", "Prefiro atividades que permitam interação frequente com outras pessoas."], ["C", "Tenho interesse em explicar minhas ideias de maneira que outras pessoas participem."], ["C", "Sinto-me motivado quando posso trocar experiências e conhecimentos com a equipe."], ["T", "Prefiro manter uma rotina de trabalho com etapas previsíveis."], ["T", "Procuro oferecer apoio quando percebo que um colega está com dificuldades."], ["T", "Valorizo acordos que contribuam para um ambiente de trabalho cooperativo."], ["T", "Gosto de acompanhar uma atividade até sua conclusão, mantendo continuidade."], ["T", "Antes de alterar uma rotina, procuro compreender como a mudança afetará as pessoas envolvidas."], ["T", "Tenho facilidade para manter o compromisso com tarefas que exigem dedicação constante."], ["E", "Gosto de organizar as etapas de uma tarefa antes de começar."], ["E", "Costumo verificar informações importantes antes de tomar uma decisão."], ["E", "Prefiro receber orientações com objetivos e critérios claramente definidos."], ["E", "Tenho o hábito de revisar meu trabalho para identificar possíveis erros."], ["E", "Gosto de utilizar registros, controles ou listas para acompanhar atividades."], ["E", "Ao resolver problemas, procuro compreender suas causas e analisar diferentes possibilidades."]];
const AREAS=[...new Set(QUESTIONS.map(q=>q.area))], DIM={A:'Ação',C:'Conexão',T:'Constância',E:'Estrutura'};
const NAV=[['inicio','Visão geral'],['empresas','Empresas'],['dashboard','Painel da empresa'],['diagnostico','Diagnóstico 360°'],['swot','Matrizes SWOT'],['planos','Planos 5W2H'],['rh','RH/DP — Indicadores'],['relatorios','Relatórios 360°'],['map','MAP 360°'],['dados','Backup e dados']];
const STORE='santanna360_v8_local';let db,active='',page='inicio',area=AREAS[0],mapAnswers={},mapResult=null;
function fresh(){return {companies:[],diagnostics:{},swots:[],plans:[],hr:{},targets:{},map:[]}}
try{db=JSON.parse(localStorage.getItem(STORE))||fresh()}catch(e){db=fresh()};for(const k of Object.keys(fresh()))if(!db[k])db[k]=fresh()[k];active=localStorage.getItem(STORE+'_active')||'';
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));localStorage.setItem(STORE+'_active',active)}catch(e){alert('Não foi possível salvar no navegador. Exporte um backup e verifique o espaço disponível.')}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});const pct=n=>fmt(n)+'%';const num=v=>Math.max(0,Number(v)||0);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function company(){return db.companies.find(c=>c.id===active)}function must(){if(!company()){document.getElementById('main').innerHTML='<h2>Selecione uma empresa</h2><p>Cadastre ou escolha uma empresa para acessar este módulo.</p><button class="primary" onclick="view(\'empresas\')">Ir para empresas</button>';return false}return true}
function view(p){page=p;document.getElementById('hero').style.display=p==='inicio'?'block':'none';document.getElementById('menu').innerHTML=NAV.map(([k,v])=>`<button class="${p===k?'active':''}" onclick="view('${k}')">${v}</button>`).join('');({inicio,empresas,dashboard,diagnostico,swot,planos,rh,relatorios,map,dados}[p]||inicio)();window.scrollTo({top:0,behavior:'instant'})}
function topoPainel(title,subtitle=''){return `<div class="row"><div><h2>${title}</h2><p class="muted">${subtitle}</p></div><div><span class="tag">${esc(company()?.name||'Nenhuma empresa ativa')}</span></div></div>`}
function inicio(){document.getElementById('main').innerHTML=topoPainel('Sant’Anna 360 — Gestão integrada','Protótipo operacional v8 • selecione uma empresa para começar')+`<div class="cards"><div class="card"><h3>Diagnosticar</h3><p>48 perguntas em 6 módulos, com análise por item.</p></div><div class="card"><h3>Planejar</h3><p>SWOT e 5W2H vinculados aos itens e aos indicadores.</p></div><div class="card"><h3>Mensurar</h3><p>RH/DP com metas, alertas e relatórios técnicos.</p></div><div class="card"><h3>Desenvolver</h3><p>MAP 360° com 24 afirmações e devolutiva educativa.</p></div></div><div class="notice">Versão demonstrativa: os dados ficam somente neste navegador. Não inserir dados pessoais reais ou informações confidenciais de clientes. Não há autenticação ou isolamento de acesso no servidor.</div><div class="actions"><button class="primary" onclick="view('empresas')">Selecionar empresa</button><button onclick="view('relatorios')">Ver relatórios</button></div>`}
function empresas(){document.getElementById('main').innerHTML=topoPainel('Cadastro de empresas','Cada diagnóstico, indicador, matriz e plano pertence a uma empresa')+`<div class="card"><h3>Nova empresa</h3><form onsubmit="addCompany(event)"><div class="two"><div><label>Razão social ou nome *</label><input id="cname" required maxlength="120"></div><div><label>CNPJ (opcional)</label><input id="ccnpj" maxlength="18"></div></div><div class="actions"><button class="primary">Cadastrar e selecionar</button></div></form></div><div class="tablewrap"><table><thead><tr><th>Empresa</th><th>CNPJ</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${db.companies.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.cnpj)}</td><td>${active===c.id?'<span class="tag ok">Ativa</span>':'—'}</td><td><button onclick="choose('${c.id}')">Selecionar</button> <button onclick="renameCompany('${c.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="4">Nenhuma empresa cadastrada.</td></tr>'}</tbody></table></div>`}
function addCompany(e){e.preventDefault();let name=document.getElementById('cname').value.trim();if(!name)return;let c={id:uid(),name,cnpj:document.getElementById('ccnpj').value.trim()};db.companies.push(c);active=c.id;save();view('dashboard')}
function choose(id){active=id;save();view('dashboard')}function renameCompany(id){let c=db.companies.find(x=>x.id===id),v=prompt('Nome da empresa',c.name);if(v&&v.trim()){c.name=v.trim();save();empresas()}}
function dashboard(){if(!must())return;let ans=db.diagnostics[active]||{},h=Object.keys(db.hr[active]||{}).length,plans=db.plans.filter(x=>x.company===active);document.getElementById('main').innerHTML=topoPainel('Painel da empresa','Visão consolidada da consultoria')+`<div class="cards"><div class="card"><div class="muted">Itens diagnosticados</div><div class="kpi">${Object.keys(ans).length}/48</div></div><div class="card"><div class="muted">Matrizes SWOT</div><div class="kpi">${db.swots.filter(x=>x.company===active).length}</div></div><div class="card"><div class="muted">Planos 5W2H</div><div class="kpi">${plans.length}</div></div><div class="card"><div class="muted">Competências RH/DP</div><div class="kpi">${h}</div></div></div><h3>Áreas do diagnóstico</h3><div class="cards">${AREAS.map(a=>{let qs=QUESTIONS.filter(q=>q.area===a),n=qs.filter(q=>ans[q.id]?.answer).length;return `<div class="card"><strong>${esc(a)}</strong><p>${n} de 8 respondidas</p><div class="progress"><span style="width:${n/8*100}%"></span></div></div>`}).join('')}</div><div class="actions"><button class="primary" onclick="view('diagnostico')">Iniciar diagnóstico</button><button onclick="view('rh')">Lançar RH/DP</button></div>`}
function getAnswer(id){return db.diagnostics[active]?.[id]||{}}
function diagnostico(){if(!must())return;let qs=QUESTIONS.filter(q=>q.area===area);document.getElementById('main').innerHTML=topoPainel('Diagnóstico Organizacional 360°','48 perguntas • 6 módulos • relatório analítico com pelo menos um parágrafo por item')+`<label>Área de avaliação</label><select id="area" onchange="area=this.value;diagnostico()">${AREAS.map(a=>`<option ${a===area?'selected':''}>${esc(a)}</option>`).join('')}</select><div class="notice">Cada resposta fica vinculada à empresa ativa. As análises SWOT e os planos 5W2H são associados ao item correspondente.</div>${qs.map(q=>{let x=getAnswer(q.id);return `<details><summary>${esc(q.text)} <span class="tag">${esc(x.answer||'Pendente')}</span></summary><label>Resposta</label><select id="ans-${q.id}"><option value="">Selecione</option>${['Sim','Parcialmente','Não','Não se aplica'].map(v=>`<option ${x.answer===v?'selected':''}>${v}</option>`).join('')}</select><label>Evidências / observações</label><textarea id="obs-${q.id}">${esc(x.notes||'')}</textarea><div class="actions"><button class="primary" onclick="saveAnswer('${q.id}')">Salvar resposta</button><button onclick="editSwot('${q.id}')">Matriz SWOT</button><button onclick="editPlan('${q.id}','diagnostico')">Plano 5W2H</button></div>${x.answer?`<div class="report"><label for="analise-${q.id}">Análise técnica do item — editável</label><textarea id="analise-${q.id}" rows="7" style="min-height:170px">${esc(x.customAnalysis ?? diagnosticText(q,x))}</textarea><div class="actions"><button class="primary" onclick="saveAnalysis('${q.id}')">Salvar análise</button><button onclick="resetAnalysis('${q.id}')">Restaurar texto sugerido</button></div><p class="small muted">A análise editada será utilizada no relatório 360° e nos documentos impressos. Salve a resposta antes de editar a análise.</p></div>`:''}</details>`}).join('')}`}
function saveAnswer(id){
  const answer=document.getElementById('ans-'+id).value;
  const notes=document.getElementById('obs-'+id).value;
  if(!db.diagnostics[active])db.diagnostics[active]={};
  const previous=db.diagnostics[active][id]||{};
  // Se a resposta mudar, a análise antiga pode ficar contraditória: gerar nova sugestão.
  const customAnalysis=previous.answer===answer?previous.customAnalysis:undefined;
  db.diagnostics[active][id]={answer,notes,customAnalysis,updated:new Date().toISOString()};
  save();diagnostico();
}
function saveAnalysis(id){
  if(!db.diagnostics[active]?.[id]?.answer){alert('Salve primeiro a resposta do diagnóstico.');return;}
  const textarea=document.getElementById('analise-'+id);
  if(!textarea)return;
  const text=textarea.value.trim();
  if(!text){alert('A análise não pode ficar vazia. Para recuperar a sugestão original, use Restaurar texto sugerido.');return;}
  db.diagnostics[active][id].customAnalysis=text;
  db.diagnostics[active][id].updated=new Date().toISOString();
  save();
  alert('Análise técnica salva para esta empresa e este item.');
}
function resetAnalysis(id){
  const x=db.diagnostics[active]?.[id];
  const q=QUESTIONS.find(q=>q.id===id);
  if(!x||!q)return;
  if(!confirm('Restaurar o texto sugerido? Sua edição anterior será substituída.'))return;
  delete x.customAnalysis;
  x.updated=new Date().toISOString();save();
  document.getElementById('analise-'+id).value=diagnosticText(q,x);
}

function diagnosticText(q,x){
  const resposta=x.answer;
  const observacao=(x.notes||'').trim();
  let analise='';
  if(resposta==='Não' && q.id==='01-01'){
    analise='O diagnóstico registra que a empresa não possui fluxo de caixa atualizado, conforme a resposta informada. A ausência de acompanhamento sistemático das entradas, saídas e saldos pode comprometer a previsibilidade financeira e a programação dos pagamentos. Recomenda-se implantar um fluxo de caixa atualizado e estabelecer rotinas de conferência, projeções e acompanhamento gerencial.';
  }else if(resposta==='Sim'){
    analise='O diagnóstico registra resposta positiva ao requisito avaliado: "'+q.text+'". Conforme a declaração, o processo está implementado, mas a efetividade deve ser confirmada por evidências, frequência de execução e resultados.';
  }else if(resposta==='Parcialmente'){
    analise='O diagnóstico registra atendimento parcial ao requisito avaliado: "'+q.text+'". A prática pode existir de forma incompleta ou irregular. Recomenda-se identificar as lacunas, definir responsáveis e padronizar controles.';
  }else if(resposta==='Não'){
    analise='O diagnóstico registra que o requisito avaliado NÃO é atendido, conforme resposta à pergunta: "'+q.text+'". Essa ausência representa uma fragilidade potencial de gestão, cuja relevância e impactos devem ser avaliados com base nas evidências. Recomenda-se estruturar a implantação do processo ou controle correspondente.';
  }else if(resposta==='Não se aplica'){
    analise='O requisito descrito na pergunta "'+q.text+'" foi classificado como não aplicável. É necessário registrar a justificativa e revisá-la se o contexto da empresa mudar.';
  }else{return 'Item ainda não avaliado.';}

">${i.value===null?'—':fmt(i.value)+i.unit}</div><span class="tag ${status(i)==='Fora da meta'?'bad':status(i)==='Dentro da meta'?'ok':''}">${status(i)}</span>${i.target!==null?`<p class="small">Meta máxima: ${fmt(i.target)}%</p>`:''}${status(i)==='Fora da meta'?`<button onclick="editPlan('${i.key}@${mon}','rh')">Abrir 5W2H</button>`:''}</div>`).join('')}</div><div class="actions"><button onclick="view('relatorios')">Emitir relatório técnico</button></div>`}

function reportHr(i,mon,m,prev){let s=status(i),result=i.value===null?'não pôde ser calculado':`${fmt(i.value)}${i.unit}`,ref=i.target===null?'não possui meta numérica definida':`tem referência interna máxima de ${fmt(i.target)}%`;let delta=prev?.[i.key];let trend=delta===undefined||delta===null||i.value===null?'Não há histórico comparável suficiente para descrever tendência.':`Em comparação com a competência anterior, a variação foi de ${fmt(i.value-delta)} ${i.unit==='%'?'ponto(s) percentual(is)':'unidade(s)'}.`;let intro={turnover:'O turnover sintetiza a movimentação de entradas e saídas em relação ao efetivo médio e exige contextualização por tipo de desligamento e setor.',absence:'O absenteísmo considera as horas de ausência informadas, sem duplicidade, sobre as horas previstas de trabalho.',unjustified:'O absenteísmo injustificado considera exclusivamente horas de ausência classificadas como injustificadas.',admissions:'As admissões devem ser avaliadas em relação ao planejamento de pessoal, expansão e reposições.',exits:'Os desligamentos devem ser analisados por motivo, voluntariedade e impacto operacional.',headcount:'O headcount representa o efetivo no encerramento da competência e deve ser comparado com a necessidade operacional.',medical:'As horas de atestados são um agregado administrativo; informações clínicas e diagnósticos não devem integrar este relatório.',justified:'As outras ausências justificadas devem ser registradas separadamente dos atestados para evitar dupla contagem.',absencehours:'O total de horas de ausência reúne atestados, outras justificadas e injustificadas, conforme a metodologia cadastrada.'}[i.key];let p1=`Na competência ${mon}, o indicador ${i.name.toLowerCase()} apresentou ${result} e ${ref}. Situação: ${s.toLowerCase()}. ${intro} ${trend}`;let advice={turnover:'Recomenda-se examinar desligamentos voluntários e involuntários, áreas com maior rotatividade, práticas de integração e retenção, sem atribuir causas antes de verificar as
