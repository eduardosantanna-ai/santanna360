:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#203047;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}aside{width:246px;background:#14263e;color:#d8e3ef;padding:23px 15px;flex-shrink:0}.brand{font-size:23px;font-weight:800;color:#fff;margin:4px 10px 2px}.brand span{color:#e5bd6c}.tag{font-size:10px;letter-spacing:1.4px;color:#d6b36a;margin:0 10px 30px}.nav{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#d3dfed;padding:13px 15px;border-radius:9px;text-align:left;font-size:14px;cursor:pointer;margin:3px 0}.nav:hover,.nav.active{background:#2c4663;color:#fff}.nav.active{border-left:3px solid #e5bd6c}main{flex:1;min-width:0}header{background:white;border-bottom:1px solid #e4e9f1;padding:19px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px}.eyebrow{font-size:12px;color:#78879a}.user{font-size:13px;color:#52637a}.content{padding:30px;max-width:1400px;margin:auto}h1{font-size:26px;margin:0 0 7px}h2{font-size:18px;margin:0 0 17px}.sub{color:#718096;font-size:14px;margin:0 0 26px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.select,select,input,textarea{background:white;border:1px solid #dce3eb;border-radius:8px;padding:10px 12px;color:#25364c;font:inherit;max-width:100%}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:22px 0}.card{background:white;border:1px solid #e5eaf1;border-radius:13px;padding:21px;box-shadow:0 3px 10px #182a4210}.metric small{display:block;color:#728197;font-size:13px}.metric strong{display:block;font-size:29px;color:#152a43;margin:10px 0}.metric em{font-size:12px;color:#7c8a9b;font-style:normal}.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.barrow{margin:17px 0}.barrow label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.track{height:10px;background:#e8edf3;border-radius:30px;overflow:hidden}.fill{height:100%;background:#c6a15c;border-radius:30px}.btn{border:0;background:#183755;color:#fff;padding:11px 16px;border-radius:8px;cursor:pointer;font-weight:600}.btn:hover{background:#30577b}.btn.light{background:#e9eef5;color:#203b58}.actions{display:flex;gap:9px;flex-wrap:wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:13px 12px;border-bottom:1px solid #e9edf2;text-align:left}th{color:#66788d;font-weight:600;background:#f8fafc}.pill{display:inline-block;border-radius:30px;padding:5px 10px;background:#edf3fb;color:#355878;font-size:12px}.pill.done{background:#e4f6e9;color:#267345}.pill.pending{background:#fff2d9;color:#966b1b}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#5a6b7e}.field input,.field select,.field textarea{width:100%}.question{border-bottom:1px solid #edf0f4;padding:15px 0}.question label{display:block;margin-bottom:9px;font-size:14px}.question select{width:220px}.chart{display:flex;align-items:end;gap:18px;height:195px;border-bottom:1px solid #dce4ed;padding:10px 15px 0}.chartgroup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:8px}.chartbars{height:150px;width:100%;display:flex;align-items:end;justify-content:center;gap:5px}.chartbars i{display:block;width:30%;max-width:32px;background:#264a70;border-radius:4px 4px 0 0}.chartbars i:nth-child(2){background:#c7a15b}.chartgroup small{font-size:11px;color:#79899b}.legend{font-size:12px;color:#758399;margin-top:18px}.legend b{color:#264a70}.legend span{color:#c7a15b}.empty{padding:25px;color:#78879b;text-align:center}.notice{background:#fff7e8;color:#7b5d29;padding:13px;border-radius:8px;font-size:13px;margin:12px 0}.footer{font-size:12px;color:#8290a1;margin-top:35px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c8a763} @media(max-width:980px){aside{width:205px}.metrics{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:650px){.app{display:block}aside{width:100%;padding:12px}.brand{font-size:20px}.tag{margin-bottom:10px}.menu{display:flex;overflow-x:auto;gap:4px}.nav{white-space:nowrap;width:auto;padding:9px 12px;font-size:12px}header{padding:15px}.content{padding:18px}.metrics{gap:10px}.card{padding:15px}.metric strong{font-size:23px}.formgrid{grid-template-columns:1fr}}

.hero360{background:linear-gradient(125deg,#10233a 0%,#1c3c59 70%,#244f6a 100%);border-radius:20px;padding:52px 48px;color:#fff;position:relative;overflow:hidden}.hero360:after{content:"360°";position:absolute;right:-20px;bottom:-60px;font-size:175px;font-weight:900;color:#ffffff09;pointer-events:none}.hero-label{font-size:11px;letter-spacing:2px;color:#e8c780;font-weight:700}.hero360 h1{font-size:clamp(30px,4vw,51px);line-height:1.12;max-width:630px;margin:18px 0}.hero360 h1 span{color:#e6c077}.hero360 p{color:#d7e3ee;max-width:580px;font-size:16px;line-height:1.7}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 32px}.gold360{background:#e2b866;color:#18283a}.gold360:hover{background:#f2d394}.outline360{background:transparent;border:1px solid #7d93aa}.outline360:hover{background:#ffffff22}.hero-foot{color:#a9bdce;font-size:10px;letter-spacing:1.3px}.welcome360{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:34px 0 17px;flex-wrap:wrap}.welcome360 h2{font-size:24px;margin:5px 0}.welcome360 .sub{margin:0}.quick360{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.quick-card360{border:1px solid #e4eaf1;background:white;border-radius:14px;padding:23px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:11px;cursor:pointer;color:#1b3048;box-shadow:0 3px 10px #182a4210;min-height:180px}.quick-card360:hover{border-color:#c49c56;transform:translateY(-2px);box-shadow:0 9px 20px #182a4218}.quick-icon360{display:grid;place-items:center;width:41px;height:41px;background:#f4ecdb;color:#8e682d;border-radius:10px;font-size:24px}.quick-card360 strong{font-size:16px}.quick-card360 small{color:#718096;line-height:1.45;font-size:12px}.quick-arrow360{color:#a17c3f;font-size:12px;font-weight:700;margin-top:auto}.home-bottom360{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.home-stats360{display:flex;justify-content:space-between;gap:12px}.home-stats360 div{display:flex;flex-direction:column;gap:5px}.home-stats360 strong{font-size:22px;color:#14263e}.home-stats360 small{font-size:11px;color:#718096}.home-disclaimer360{font-size:12px;color:#8996a6;margin-top:22px}@media(max-width:1050px){.quick360{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.hero360{padding:32px 23px}.quick360,.home-bottom360{grid-template-columns:1fr}.hero360:after{display:none}}
.swotgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.swotcard{border-top:5px solid #6e93b8}.swotcard.forca{border-top-color:#248c67}.swotcard.fraqueza{border-top-color:#c08b37}.swotcard.oportunidade{border-top-color:#3475b9}.swotcard.ameaca{border-top-color:#bb5959}.swotitem{padding:12px 0;border-top:1px solid #e7eaf0}.swotitem p{color:#67778b;font-size:13px;white-space:pre-wrap}@media(max-width:750px){.swotgrid{grid-template-columns:1fr}} </style></head><body><div class="app"><aside><div class="brand">Sant'Anna <span>360°</span></div><div class="tag">GESTÃO INTELIGENTE</div><nav class="menu" id="menu"></nav></aside><main><header><div><div class="eyebrow">Plataforma de consultoria empresarial</div><strong id="headTitle">Visão geral</strong></div><div class="user">◉ Ambiente demonstrativo</div></header><section class="content" id="content"></section></main></div><script>
const tabs=[['inicio','⌂','Página inicial'],['dashboard','▦','Visão geral'],['clientes','▣','Clientes'],['diagnostico','◎','Diagnóstico 360'],['swot','◈','Matriz SWOT'],['rh','♙','RH e DP'],['financas','▤','Finanças'],['acoes','☑','Planos de ação'],['relatorios','▧','Relatórios']];
const KEY='santanna360_demo_v1';const initial={companies:[{id:1,name:'Empresa Modelo A',sector:'Transporte e logística',city:'São Mateus/ES'},{id:2,name:'Empresa Modelo B',sector:'Comércio',city:'Linhares/ES'},{id:3,name:'Empresa Modelo C',sector:'Serviços',city:'Vitória/ES'}],selected:1,answers:{},actions:[{id:1,company:1,title:'Revisar controle de jornada',owner:'Gerência RH',deadline:'2026-11-10',status:'Em andamento',priority:'Alta'},{id:2,company:1,title:'Implantar DRE gerencial',owner:'Controladoria',deadline:'2026-11-20',status:'Pendente',priority:'Alta'},{id:3,company:1,title:'Mapear processo de admissão',owner:'RH',deadline:'2026-11-30',status:'Concluído',priority:'Média'}]};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){data=structuredClone(initial)};data.swot??={};data.actions.forEach(a=>{a.why??='';a.where??='';a.how??='';a.cost??='';a.swotId??=''});let page='inicio';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function company(){return data.companies.find(x=>x.id===+data.selected)||data.companies[0]}function score(){let a=data.answers[data.selected]||{};let vals=Object.values(a).map(Number).filter(x=>x>0);return vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/vals.length*25):null}function navigate(p){page=p;render()}function selectCompany(id){data.selected=+id;save();render()}function header(title,desc){return `<div class="top"><div><h1>${title}</h1><p class="sub">${desc}</p></div>${page==='clientes'?'':`<select aria-label="Empresa selecionada" onchange="selectCompany(this.value)">${data.companies.map(x=>`<option value="${x.id}" ${x.id===+data.selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`}</div>`}function metric(n,v,d){return `<div class="card metric"><small>${n}</small><strong>${v}</strong><em>${d}</em></div>`}function progress(n,v){return `<div class="barrow"><label><span>${n}</span><strong>${v}%</strong></label><div class="track"><div class="fill" style="width:${v}%"></div></div></div>`}function barchart(){return `<div class="chart">${[['Jul',55,43],['Ago',62,48],['Set',74,56],['Out',82,65]].map(([m,a,b])=>`<div class="chartgroup"><div class="chartbars"><i style="height:${a}%"></i><i style="height:${b}%"></i></div><small>${m}</small></div>`).join('')}</div><div class="legend"><b>■</b> Indicador A &nbsp; <span>■</span> Indicador B — valores ilustrativos</div>`}function inicio(){let nome=esc(company().name),s=score(),abertas=data.actions.filter(x=>x.company===+data.selected&&x.status!=='Concluído').length;return `<div class="hero360"><div class="hero-label">PLATAFORMA DE INTELIGÊNCIA EM GESTÃO</div><h1>Bem-vindo à <span>Sant'Anna 360°</span></h1><p>Transforme diagnósticos em decisões. Integre pessoas, finanças, processos e estratégia em uma única experiência de gestão.</p><div class="hero-actions"><button class="btn gold360" onclick="navigate('diagnostico')">Iniciar diagnóstico →</button><button class="btn outline360" onclick="navigate('dashboard')">Abrir painel executivo</button></div><div class="hero-foot">METODOLOGIA PRÓPRIA · VISÃO INTEGRADA · MELHORIA CONTÍNUA</div></div><div class="welcome360"><div><div class="eyebrow">SEU AMBIENTE DE TRABALHO</div><h2>Comece por aqui</h2><p class="sub">Acesse as principais áreas da plataforma.</p></div><select aria-label="Selecionar empresa" onchange="selectCompany(this.value)">${data.companies.map(x=>`<option value="${x.id}" ${x.id===+data.selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="quick360">${[['◎','Diagnóstico 360','Avalie a maturidade e identifique prioridades.','diagnostico'],['▦','Painel executivo','Acompanhe os indicadores da empresa.','dashboard'],['♙','Pessoas e RH','Explore a gestão estratégica de pessoas.','rh'],['▤','Controladoria','Visualize os resultados financeiros.','financas'],['◈','Matriz SWOT','Identifique forças, fraquezas, oportunidades e ameaças.','swot'],['☑','Planos de ação','Organize responsabilidades e prazos.','acoes'],['▧','Relatórios','Gere análises e documentos gerenciais.','relatorios']].map(([ic,t,d,id])=>`<button class="quick-card360" onclick="navigate('${id}')"><span class="quick-icon360">${ic}</span><strong>${t}</strong><small>${d}</small><span class="quick-arrow360">Acessar →</span></button>`).join('')}</div><div class="home-bottom360"><div class="card"><div class="eyebrow">EMPRESA ATIVA</div><h2>${nome}</h2><p class="sub" style="margin-bottom:14px">${esc(company().sector)} · ${esc(company().city)}</p><div class="home-stats360"><div><strong>${s===null?'—':s+'/100'}</strong><small>Maturidade</small></div><div><strong>${abertas}</strong><small>Ações abertas</small></div><div><strong>${data.companies.length}</strong><small>Clientes cadastrados</small></div></div></div><div class="card"><div class="eyebrow">SOBRE A METODOLOGIA</div><h2>Da análise à transformação</h2><p style="color:#66778b;line-height:1.7">Diagnosticar → Planejar → Implantar → Medir → Desenvolver → Melhorar. Um ciclo contínuo para gerar resultados mensuráveis.</p><button class="btn" onclick="navigate('clientes')">Gerenciar clientes →</button></div></div><p class="home-disclaimer360">Ambiente demonstrativo local. Não insira informações pessoais ou confidenciais.</p>`}function dashboard(){let s=score(),a=data.actions.filter(x=>x.company===+data.selected);return header('Painel executivo','Visão integrada da empresa e das prioridades de gestão.')+`<div class="metrics">${metric('Maturidade',s===null?'—':s+'/100',s===null?'Diagnóstico não preenchido':'Baseado no questionário')}${metric('Ações abertas',a.filter(x=>x.status!=='Concluído').length,'Plano de ação')}${metric('Processos mapeados','18','Exemplo ilustrativo')}${metric('Conformidade','91%','Exemplo ilustrativo')}</div><div class="cols"><div class="card"><h2>Indicadores gerenciais</h2>${barchart()}</div><div class="card"><h2>Dimensões de gestão</h2>${progress('Pessoas e RH',82)}${progress('Finanças',68)}${progress('Processos',71)}${progress('Estratégia',65)}${progress('Conformidade',91)}<div class="notice">Barras ilustrativas. O diagnóstico preenchido gera uma pontuação própria.</div></div></div>`}function clientes(){return header('Carteira de clientes','Cadastre e gerencie as empresas atendidas pela consultoria.')+`<div class="card"><h2>Empresas cadastradas</h2><div class="tablewrap"><table><thead><tr><th>Empresa</th><th>Setor</th><th>Localização</th><th>Ação</th></tr></thead><tbody>${data.companies.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.sector)}</td><td>${esc(c.city)}</td><td><button class="btn light" onclick="selectCompany(${c.id});navigate('dashboard')">Abrir</button></td></tr>`).join('')}</tbody></table></div></div><div class="card" style="margin-top:18px"><h2>Cadastrar nova empresa</h2><form id="companyForm" class="formgrid"><label class="field">Razão social / Nome<input name="name" required maxlength="100" placeholder="Nome da empresa"></label><label class="field">Setor<input name="sector" required maxlength="80" placeholder="Ex.: Comércio"></label><label class="field">Cidade / UF<input name="city" required maxlength="80" placeholder="Ex.: Vitória/ES"></label><div style="align-self:end"><button class="btn" type="submit">+ Adicionar empresa</button></div></form></div>`}const questions=[['Pessoas e RH','A empresa possui processos de admissão e desligamento documentados?'],['Pessoas e RH','Há indicadores periódicos de turnover e absenteísmo?'],['Finanças','A empresa acompanha uma DRE gerencial mensal?'],['Finanças','Existe controle e projeção de fluxo de caixa?'],['Processos','Os processos críticos estão mapeados?'],['Processos','Os responsáveis e prazos são acompanhados?'],['Estratégia','Existem metas empresariais documentadas?'],['Estratégia','Os indicadores são revisados com a liderança?'],['Conformidade','Há rotinas de verificação das obrigações trabalhistas?'],['Conformidade','Há controles de acesso e proteção de dados?']];function diagnostico(){let a=data.answers[data.selected]||{},s=score();return header('Diagnóstico de gestão 360°','Responda às questões para gerar a pontuação inicial de maturidade.')+`<div class="cols"><div class="card"><h2>Questionário de avaliação</h2>${questions.map(([group,q],i)=>`<div class="question"><small style="color:#9a7842">${group}</small><label for="q${i}">${i+1}. ${q}</label><select id="q${i}" onchange="answer(${i},this.value)"><option value="">Não avaliado</option>${[['1','Não implantado'],['2','Inicial'],['3','Parcialmente implantado'],['4','Implantado']].map(([v,t])=>`<option value="${v}" ${a[i]===v?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}</div><div class="card" style="align-self:start"><h2>Resultado da avaliação</h2><div class="metric"><small>Índice de maturidade</small><strong>${s===null?'—':s+'/100'}</strong><em>${Object.keys(a).length} de ${questions.length} questões respondidas</em></div><p class="sub" style="margin-top:15px">Pontuação provisória: média das respostas (1 a 4), convertida em escala de 0 a 100. Uma metodologia validada deverá definir pesos e critérios.</p><button class="btn" onclick="navigate('relatorios')">Ver relatório</button></div></div>`}function answer(i,v){data.answers[data.selected]??={};if(v)data.answers[data.selected][i]=v;else delete data.answers[data.selected][i];save();render()}function rh(){return header('RH e Departamento Pessoal','Indicadores, conformidade e gestão estratégica de pessoas.')+`<div class="notice">Os indicadores abaixo são demonstrativos. A entrada de dados reais será implementada em uma etapa posterior.</div><div class="metrics">${metric('Colaboradores','48','Total ilustrativo')}${metric('Turnover','4,2%','Exemplo')}${metric('Absenteísmo','2,1%','Exemplo')}${metric('Treinamentos','76%','Exemplo')}</div><div class="card"><h2>Movimentação de pessoal</h2>${barchart()}</div>`}function financas(){return header('Controladoria e finanças','Análise de receitas, custos, resultados e desempenho.')+`<div class="notice">Valores financeiros exclusivamente fictícios.</div><div class="metrics">${metric('Receita','R$ 185 mil','Exemplo')}${metric('Custos e despesas','R$ 142 mil','Exemplo')}${metric('Resultado','R$ 43 mil','Exemplo')}${metric('Margem','23,2%','Exemplo')}</div><div class="card"><h2>Desempenho financeiro</h2>${barchart()}</div>`}function swot(){let items=(data.swot[data.selected]||[]);let groups=[['forca','Forças','Fatores internos positivos'],['fraqueza','Fraquezas','Fatores internos a melhorar'],['oportunidade','Oportunidades','Fatores externos favoráveis'],['ameaca','Ameaças','Riscos externos']];return header('Matriz SWOT','Identifique o cenário da empresa e converta os achados em planos 5W2H.')+`<div class="swotgrid">${groups.map(([id,name,desc])=>`<div class="card swotcard ${id}"><h2>${name}</h2><p class="sub">${desc}</p>${items.filter(x=>x.type===id).map(x=>`<div class="swotitem"><div><strong>${esc(x.title)}</strong><p>${esc(x.detail)}</p></div><div class="actions"><button class="btn light" onclick="fromSwot(${x.id})">Criar 5W2H</button><button class="btn light" onclick="deleteSwot(${x.id})">Excluir</button></div></div>`).join('')||'<p class="sub">Nenhum item cadastrado.</p>'}</div>`).join('')}</div><div class="card" style="margin-top:18px"><h2>Adicionar análise SWOT</h2><form id="swotForm" class="formgrid"><label class="field">Quadrante<select name="type" required>${groups.map(g=>`<option value="${g[0]}">${g[1]}</option>`).join('')}</select></label><label class="field">Fator identificado<input name="title" maxlength="150" required placeholder="Ex.: Alta rotatividade"></label><label class="field" style="grid-column:1/-1">Descrição e evidências<textarea name="detail" rows="3" maxlength="600" placeholder="Explique o impacto observado"></textarea></label><button class="btn" type="submit">Salvar na matriz SWOT</button></form></div>`}
function deleteSwot(id){if(!confirm('Excluir este item da SWOT?'))return;data.swot[data.selected]=(data.swot[data.selected]||[]).filter(x=>x.id!==id);save();render()}
function fromSwot(id){page='acoes';render();let field=document.querySelector('[name=swotId]');if(field){field.value=String(id);field.dispatchEvent(new Event('change'))}document.getElementById('actionForm')?.scrollIntoView({behavior:'smooth'})}
function actions(){let a=data.actions.filter(x=>x.company===+data.selected),sw=data.swot[data.selected]||[];return header('Plano de ação 5W2H','Transforme os achados da SWOT em ações mensuráveis.')+`<div class="card"><h2>Ações cadastradas</h2><div class="tablewrap"><table><thead><tr><th>O quê</th><th>Por quê</th><th>Onde</th><th>Quem</th><th>Quando</th><th>Como</th><th>Quanto</th><th>Status</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.why||'—')}</td><td>${esc(x.where||'—')}</td><td>${esc(x.owner)}</td><td>${esc(x.deadline)}</td><td>${esc(x.how||'—')}</td><td>${esc(x.cost||'—')}</td><td><select onchange="changeStatus(${x.id},this.value)">${['Pendente','Em andamento','Concluído'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></td><td><button class="btn light" onclick="deleteAction(${x.id})">Excluir</button></td></tr>`).join('')}</tbody></table></div>${a.length?'':'<div class="empty">Nenhuma ação cadastrada.</div>'}</div><div class="card" style="margin-top:18px"><h2>Novo plano 5W2H</h2><form id="actionForm" class="formgrid"><label class="field">Vincular à SWOT<select name="swotId"><option value="">Sem vínculo</option>${sw.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></label><label class="field">O quê? (What)<input name="title" required maxlength="150"></label><label class="field">Por quê? (Why)<input name="why" maxlength="200"></label><label class="field">Onde? (Where)<input name="where" maxlength="120"></label><label class="field">Quem? (Who)<input name="owner" required maxlength="100"></label><label class="field">Quando? (When)<input type="date" name="deadline" required></label><label class="field">Como? (How)<textarea name="how" maxlength="600" rows="3"></textarea></label><label class="field">Quanto custa? (How much)<input name="cost" maxlength="80" placeholder="R$ 0,00"></label><label class="field">Prioridade<select name="priority"><option>Alta</option><option>Média</option><option>Baixa</option></select></label><div style="align-self:end"><button class="btn" type="submit">Salvar plano 5W2H</button></div></form></div>`}
function deleteAction(id){if(!confirm('Excluir esta ação?'))return;data.actions=data.actions.filter(x=>x.id!==id);save();render()}
function reports(){let s=score();return header('Central de relatórios','Visualize e imprima um resumo gerencial da empresa.')+`<div class="card" id="report"><div class="top"><div><small style="color:#b08a43">SANT'ANNA 360°</small><h2 style="margin-top:8px">Relatório executivo de gestão</h2></div><span class="pill">Demonstrativo</span></div><p><b>Empresa:</b> ${esc(company().name)}<br><b>Setor:</b> ${esc(company().sector)}<br><b>Data:</b> ${new Date().toLocaleDateString('pt-BR')}</p><hr style="border:0;border-top:1px solid #e9edf2"><h2>1. Diagnóstico empresarial</h2><p>Índice calculado: <b>${s===null?'Não avaliado':s+'/100'}</b>.</p><h2>2. Plano de ação</h2><p>${data.actions.filter(x=>x.company===+data.selected&&x.status!=='Concluído').length} ações em aberto.</p><h2>3. Recomendações</h2><p>Priorizar avaliação dos processos, acompanhamento de indicadores e implantação de rotinas de gestão.</p><div class="notice">Documento preliminar. Os resultados dependem da qualidade das informações inseridas e não substituem auditoria ou parecer profissional.</div></div><div class="actions" style="margin-top:16px"><button class="btn" onclick="window.print()">Imprimir / Salvar como PDF</button><button class="btn light" onclick="exportCSV()">Exportar ações em CSV</button></div>`}function changeStatus(id,v){let a=data.actions.find(x=>x.id===id);if(a){a.status=v;save();render()}}function exportCSV(){let rows=[['O que','Por que','Onde','Quem','Quando','Como','Quanto','Prioridade','Status'],...data.actions.filter(x=>x.company===+data.selected).map(x=>[x.title,x.why,x.where,x.owner,x.deadline,x.how,x.cost,x.priority,x.status])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='santanna360_acoes.csv';a.click();URL.revokeObjectURL(a.href)}function render(){document.getElementById('menu').innerHTML=tabs.map(([id,ico,name])=>`<button class="nav ${id===page?'active':''}" onclick="navigate('${id}')"><span>${ico}</span>${name}</button>`).join('');document.getElementById('headTitle').textContent=tabs.find(x=>x[0]===page)[2];document.getElementById('content').innerHTML=({inicio,dashboard,clientes,diagnostico,swot,rh,financas,acoes:actions,relatorios:reports})[page]()+`<div class="footer">Sant'Anna 360 • Protótipo local v0.1 • Não utilize informações pessoais ou confidenciais nesta versão.</div>`;let sf=document.getElementById('swotForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let f=new FormData(sf);data.swot[data.selected]??=[];data.swot[data.selected].push({id:Date.now(),type:f.get('type'),title:f.get('title').trim(),detail:f.get('detail').trim()});save();render()};let cf=document.getElementById('companyForm');if(cf)cf.onsubmit=e=>{e.preventDefault();let f=new FormData(cf);let id=Math.max(0,...data.companies.map(x=>x.id))+1;data.companies.push({id,name:f.get('name').trim(),sector:f.get('sector').trim(),city:f.get('city').trim()});data.selected=id;save();render()};let af=document.getElementById('actionForm');if(af)af.onsubmit=e=>{e.preventDefault();let f=new FormData(af);data.actions.push({id:Math.max(0,...data.actions.map(x=>x.id))+1,company:+data.selected,title:f.get('title').trim(),why:f.get('why').trim(),where:f.get('where').trim(),how:f.get('how').trim(),cost:f.get('cost').trim(),swotId:f.get('swotId'),owner:f.get('owner').trim(),deadline:f.get('deadline'),priority:f.get('priority'),status:'Pendente'});save();render()}}render();
</script><style>@media print{aside,header,.actions,.footer,.top select{display:none!important}.content{padding:0}main{width:100%}.card{box-shadow:none;border:0}}.swotgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.swotcard{border-top:5px solid #6e93b8}.swotcard.forca{border-top-color:#248c67}.swotcard.fraqueza{border-top-color:#c08b37}.swotcard.oportunidade{border-top-color:#3475b9}.swotcard.ameaca{border-top-color:#bb5959}.swotitem{padding:12px 0;border-top:1px solid #e7eaf0}.swotitem p{color:#67778b;font-size:13px;white-space:pre-wrap}@media(max-width:750px){.swotgrid{grid-template-columns:1fr}} </style></body></html>
