
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Área restrita de clientes da Sant'Anna 360.">
  <title>Área do Cliente | Sant'Anna 360</title>

  <style>
    :root {
      --navy: #14283e;
      --gold: #b38a47;
      --bg: #f5f7fa;
      --ink: #243448;
      --muted: #637386;
      --line: #dfe5eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 20px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 23px;
      font-weight: 750;
      letter-spacing: .5px;
    }

    .subtitle {
      display: block;
      font-size: 12px;
      margin-top: 4px;
      color: #e7cc96;
    }

    header a {
      color: #f1d59b;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 36px 18px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 12px 35px rgba(20,40,62,.09);
    }

    .eyebrow {
      color: #967035;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      color: var(--navy);
      font-size: 29px;
      margin: 12px 0;
    }

    .intro {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      border: 1px solid #ccd5df;
      border-radius: 9px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(179,138,71,.13);
    }

    .password-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .password-wrap input { flex: 1; min-width: 0; }

    button {
      cursor: pointer;
      font: inherit;
      border-radius: 9px;
    }

    .show-password {
      padding: 12px 10px;
      background: white;
      border: 1px solid #ccd5df;
      color: var(--navy);
      font-size: 13px;
    }

    .submit-button {
      background: var(--navy);
      border: 1px solid var(--navy);
      color: white;
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      font-weight: 700;
    }

    .submit-button:hover { background: #294760; }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fbe9e6;
      color: #922f24;
    }

    .message.info {
      display: block;
      background: #eaf0f6;
      color: var(--navy);
    }

    .message.success {
      display: block;
      background: #e5f4ea;
      color: #236a43;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
      color: var(--navy);
      text-decoration: none;
    }

    footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .login-card { padding: 24px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <div class="brand">SANT'ANNA 360°</div>
      <span class="subtitle">
        Gestão inteligente • Pessoas, processos e resultados
      </span>
    </div>

    <a href="index.html">Voltar ao site</a>
  </header>

  <main>
    <section class="login-card" aria-labelledby="titulo">
      <span class="eyebrow">Acesso exclusivo</span>
      <h1 id="titulo">Área do Cliente</h1>

      <p class="intro">
        Acesse sua conta para utilizar os recursos
        autorizados da Sant'Anna 360.
      </p>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="username"
          placeholder="seuemail@empresa.com.br"
          required
        >

        <label for="password">Senha</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
          >
          <button
            type="button"
            class="show-password"
            id="togglePassword"
            aria-label="Mostrar senha"
          >
            Mostrar
          </button>
        </div>

        <button
          type="submit"
          class="submit-button"
          id="submitButton"
        >
          Entrar
        </button>
      </form>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <a class="back" href="index.html">
        Voltar à página inicial
      </a>
    </section>
  </main>

  <footer>
    © Sant'Anna 360° — Área restrita a usuários autorizados.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    // CONFIGURAÇÃO DO SUPABASE
    // Cole a URL exata do seu projeto, sem /rest/v1/
    // e a chave PUBLICÁVEL (sb_publishable_...).
    //
    // Nunca coloque a chave secret ou service_role aqui.

const SUPABASE_URL = 'https://okvikkifrsbovbppywgp.supabase.co';

const SUPABASE_PUBLIC_KEY = 'sb_publishable_6IMZT1ApTHN8NZeifOLUQw_oGy6P2eC';
    
const form = document.getElementById('loginForm');
const message = document.getElementById('message');
const submitButton = document.getElementById('submitButton');
const passwordInput = document.getElementById('password');
const togglePassword = document.getElementById('togglePassword');
    
    function showMessage(text, type = 'info') {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    togglePassword.addEventListener('click', () => {
      const visible = passwordInput.type === 'text';
      passwordInput.type = visible ? 'password' : 'text';
      togglePassword.textContent = visible ? 'Mostrar' : 'Ocultar';
      togglePassword.setAttribute(
        'aria-label',
        visible ? 'Mostrar senha' : 'Ocultar senha'
      );
    });

    const configured =
      SUPABASE_URL.startsWith('https://') &&
      SUPABASE_PUBLIC_KEY.startsWith('sb_publishable_');

    if (!configured) {
      submitButton.disabled = true;
      showMessage(
        'Configuração pendente: informe a URL e a chave publicável do Supabase.',
        'info'
      );
    } else if (!window.supabase) {
      submitButton.disabled = true;
      showMessage(
        'Não foi possível carregar a biblioteca de autenticação. Verifique a conexão.',
        'error'
      );
    } else {
      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY
      );

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        submitButton.textContent = 'Verificando...';
        message.className = 'message';

        try {
          const email = document.getElementById('email').value.trim();
          const password = passwordInput.value;

          const { data, error } =
            await client.auth.signInWithPassword({
              email,
              password
            });

          if (error || !data.user) {
            showMessage(
              'Não foi possível entrar. Verifique o e-mail e a senha.',
              'error'
            );
            return;
          }

          const { data: perfil, error: perfilError } =
            await client
              .from('perfis')
              .select('id, ativo, administrador')
              .eq('id', data.user.id)
              .maybeSingle();

          if (perfilError || !perfil || !perfil.ativo) {
            await client.auth.signOut();
            showMessage(
              'Sua conta não possui acesso ativo. Entre em contato com a Sant’Anna 360.',
              'error'
            );
            return;
          }

          if (!perfil.administrador) {
          await client.auth.signOut();
          showMessage('Painel do cliente em implantação.', 'info');
            return;
}
         window.location.assign('painel.html');
          showMessage(
            'Ocorreu uma falha de comunicação. Tente novamente.',
            'error'
          );
        } finally {
          passwordInput.value = '';
          submitButton.disabled = false;
          submitButton.textContent = 'Entrar';
        }
      });
    }
  </script>
</body>
</html>
